name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Documentation Lint ──────────────────────────────────────────────
  lint-docs:
    name: Verify Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required documentation files..."
          test -f README.md                              && echo "✓ README.md"
          test -f docs/tech-stack-summary.md            && echo "✓ tech-stack-summary.md"
          test -f docs/comparison-matrix.md             && echo "✓ comparison-matrix.md"
          test -f docs/architecture-diagram.md          && echo "✓ architecture-diagram.md"
          test -f docs/adr/ADR-001-frontend-framework.md && echo "✓ ADR-001"
          test -f docs/adr/ADR-002-backend-split.md     && echo "✓ ADR-002"
          test -f docs/adr/ADR-003-data-layer.md        && echo "✓ ADR-003"
          test -f docs/adr/ADR-004-identity-provider.md && echo "✓ ADR-004"
          echo "All required documentation is present."

  # ─── Frontend (Flutter) ──────────────────────────────────────────────
  frontend:
    name: Frontend — Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        continue-on-error: true   # No pubspec.yaml yet — placeholder

      - name: Analyse code
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

  # ─── Backend (NestJS) ────────────────────────────────────────────────
  backend:
    name: Backend — NestJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        continue-on-error: true   # No package.json yet — placeholder

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests
        run: npm run test
        continue-on-error: true

      - name: Run e2e tests
        run: npm run test:e2e
        continue-on-error: true

  # ─── AI Service (FastAPI) ────────────────────────────────────────────
  ai-service:
    name: AI Service — FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        continue-on-error: true   # No requirements.txt yet — placeholder

      - name: Run tests
        run: |
          if [ -f requirements.txt ]; then pytest; else echo "No tests yet — placeholder"; fi
        continue-on-error: true
